name: CI

# GitHub Actions CI for CAOS_LDA_HSI (#590). Runs on every PR + push to
# develop/main and exercises:
#   1. Backend: install requirements + dev-requirements, run the full
#      pytest suite (route inventory, schemas, CORS, builders, helpers).
#   2. Frontend: tsc -b + Vite build (type-check gate) + vitest run (#775).
#   3. data/derived/manifests/index.json is valid JSON AND current — not
#      stale vs the data/derived tree (#776, check_manifest_current.py).

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  backend-smoke:
    name: Backend import smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend + test deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r dev-requirements.txt
      - name: Verify routers import + count routes
        run: |
          python -c "from app.routers.content import router; n=len(router.routes); print(f'{n} routes registered'); assert n >= 50, 'too few routes — regression?'"
      - name: Run pytest
        run: python -m pytest tests/ -q
      - name: Verify manifest is valid JSON
        run: |
          python -c "import json; d=json.load(open('data/derived/manifests/index.json')); n=len(d.get('artifacts', [])); print(f'manifest has {n} artefacts')"
      - name: Verify manifest is current (not stale vs data/derived) (#776)
        run: python data-pipeline/check_manifest_current.py

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend deps
        run: npm ci --no-audit --no-fund
      - name: Build (tsc -b + vite build)
        run: npm run build
      - name: Test (vitest run) (#775)
        run: npm run test
